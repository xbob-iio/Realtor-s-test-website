name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: doma
          POSTGRES_PASSWORD: doma-ci-password
          POSTGRES_DB: doma_rent
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U doma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Тестовые значения только для CI — не используйте их в production
    env:
      DATABASE_URL: postgresql://doma:doma-ci-password@localhost:5432/doma_rent
      AUTH_SECRET: ci-only-secret-never-use-in-production-0123456789
      SITE_URL: http://localhost:3000
      STORAGE_DRIVER: local
      UPLOAD_DIR: storage/uploads
      TELEGRAM_URL: https://t.me/example_channel
      WHATSAPP_URL: https://wa.me/380500000000
      VIBER_URL: viber://chat?number=%2B380500000000
      CONTACT_PHONE: '+380 50 000 00 00'
      CONTACT_EMAIL: hello@example.com
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-admin-password-123

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Migrate and seed database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E acceptance tests
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          npx playwright test --project=desktop --project=mobile

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results
            server.log
          retention-days: 7
