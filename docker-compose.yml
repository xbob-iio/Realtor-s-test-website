# Альтернатива `npm run db:local:init` для тех, у кого есть Docker:
#   docker compose up -d
# и в .env: DATABASE_URL=postgresql://doma:change-me@localhost:5433/doma_rent
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doma
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: doma_rent
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doma']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
